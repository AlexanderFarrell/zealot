services:
  server:
    build: 
      context: .
      dockerfile: apps/server/Dockerfile
    image: zealot-server:local
    environment:
      DATABASE: sqlite
      DB_FILENAME: /data/zealot.db
      MEDIA_SOURCE: FILESYSTEM
      MEDIA_PATH: /data/public
      PORT: "8456"
      BACKUP_PATH: /backups
      BACKUP_ENABLED: "false"
      BACKUP_SCHEDULE: "0 2 * * *"
      BACKUP_RETENTION_COUNT: "7"
      RUST_LOG: "zealot_app=info,zealot_api=info,warn"
    ports:
      - "8456:8456"
    volumes:
      - zealot_data:/data
      - zealot_backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8456/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: zealot-web:local
    environment:
      API_UPSTREAM: http://server:8456
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    image: registry.alexanderfarrell.net/zealot-mcp:latest
    environment:
      ZEALOT_URL: http://server:8456
      ZEALOT_API_KEY: ""
      MCP_MODE: http
      MCP_PORT: "3100"
    ports:
      - "3100:3100"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' | nc -w2 localhost 3100 | grep -q '200 OK'"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  zealot_data:
  zealot_backups:
