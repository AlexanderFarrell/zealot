# Local-first SonarQube preparation for Zealot.
# Future CI/scanner activation should provide:
# - SONAR_HOST_URL
# - SONAR_TOKEN
# - Optional override for sonar.projectKey / sonar.projectName

sonar.projectKey=zealot
sonar.projectName=Zealot
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=apps,crates,packages,scripts/analysis
sonar.tests=test

sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/artifacts/**,**/*.tsbuildinfo,**/playwright-report/**,**/.venv/**,**/__pycache__/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/artifacts/**
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/artifacts/**,**/*.tsbuildinfo
sonar.cpd.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/artifacts/**

# Keep scanner metadata and future imported issue artifacts in the shared analysis area.
sonar.scanner.metadataFilePath=artifacts/analysis/sonar/report-task.txt
