services:
  server:
    image: registry.alexanderfarrell.net/zealotd:v0.1.0
    environment:
      DATABASE: sqlite
      DB_FILENAME: /data/zealot.db
      MEDIA_SOURCE: FILESYSTEM
      MEDIA_PATH: /data/public
      PORT: "8456"
      BACKUP_PATH: /backups
      BACKUP_ENABLED: "false"
      RUST_LOG: "zealot_app=info,zealot_api=info,warn"
    ports:
      - "8456:8456"
    volumes:
      - zealot_data:/data
      - zealot_backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8456/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  zealot_ui:
    image: registry.alexanderfarrell.net/zealot-web:v0.1.0
    environment:
      API_UPSTREAM: http://server:8456
    # depends_on:
      # server:
        # condition: service_healthy
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  zealot_data:
  zealot_backups:
