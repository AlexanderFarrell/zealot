name: zealot-e2e

services:
  server:
    image: zealot-server:e2e
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE: ${ZEALOT_E2E_DATABASE:-sqlite}
      DB_USERNAME: ${ZEALOT_E2E_DB_USERNAME:-zealot}
      DB_PASSWORD: ${ZEALOT_E2E_DB_PASSWORD:-zealot}
      DB_HOST: ${ZEALOT_E2E_DB_HOST:-postgres}
      DB_DATABASE: ${ZEALOT_E2E_DB_DATABASE:-zealot}
      DB_FILENAME: /data/zealot.db
      MEDIA_SOURCE: FILESYSTEM
      MEDIA_PATH: /data/public
      PORT: "8456"
    ports:
      - "127.0.0.1:18456:8456"
    volumes:
      - ./zealot_data:/data
    command:
      - sh
      - -c
      - |
        umask 000
        mkdir -p /data/public
        chmod -R a+rwX /data
        exec /usr/local/bin/zealot-server
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8456/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres:
    image: postgres:16-bookworm
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${ZEALOT_E2E_DB_USERNAME:-zealot}
      POSTGRES_PASSWORD: ${ZEALOT_E2E_DB_PASSWORD:-zealot}
      POSTGRES_DB: ${ZEALOT_E2E_DB_DATABASE:-zealot}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    image: zealot-web:e2e
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://server:8456
    ports:
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
